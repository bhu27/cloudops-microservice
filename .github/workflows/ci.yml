name: CloudOps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Build Docker image
        run: docker build -t cloudops-microservice .

      - name: Run Docker container
        run: |
          docker run -d -p 5000:5000 --name cloudops-test cloudops-microservice
          sleep 5

      - name: Test application
        run: |
          curl http://localhost:5000/health

      - name: Stop container
        if: always()
        run: docker stop cloudops-test || true